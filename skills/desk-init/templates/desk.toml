# AI Desk Tools の設定（desk-init が置く。自分の値にして、desk-doctor で確かめる）
#
# ワークスペースは、資料のフォルダ（Customers/・Internal/・Research/）と決まり（recipes/）を置くフォルダ（例: ~/Documents）。
# この設定は、次のどちらか 1 つに置く。スクリプトと hook は、今いるフォルダから上へ desk.toml を探し、なければ ~/.desk.toml を読む。見つかった 1 つだけを読み、混ぜない。
# - ワークスペースの直下の desk.toml: そのフォルダの中で開いた会話だけが読む（ワークスペースを分けて持つとき、試しの sandbox）。
# - ~/.desk.toml（環境変数 DESK_CONFIG で場所を替えられる）: 頭の workspace にワークスペースを書く。どのフォルダで開いた会話も、そのワークスペースを使う。そのワークスペースには desk.toml を置かない。
# 実行のたびに書く記録（lint の記録、desk-dreaming の前回の時刻・報告・写し、コメントを前に取った時刻と見張りの起点）は、ワークスペースの .desk/ に置かれる。
#
# - ここに書くもの: 人や組織で変わる値だけ（社名は下の brand。会社のテンプレートの書体と色は、下のテーマのファイルに書く）。見た目の決まり（色の役割・余白・版面）は slides.py とスキル deck-design の slides。
# - 値の形: Google Slides と Drive のフォルダは URL のまま書く（スクリプトが ID を取り出す）。
# - テーマ: 色・書体・使い分けの description はワークスペースの themes/slides/<名前>.json に書き（組み込みは navy・white・blue）、ここの [slides.templates] には
#   テーマごとのテンプレートの URL だけを書く（エージェントが slides.py themes で一覧を見て、資料ごとに選ぶ）。URL は template.py <名前> --from-base が書き込む。
#   元のテンプレートの URL はここに持たない（--from-base <元の URL> で渡す。渡さなければ白紙の pptx から作る）。

[desk]
default_language = "ja"  # 資料を作る既定の言語。言語のコード（"ja"・"en" など）で書く。本文・スピーカーノート・納品物の名前をこの言語で書く。資料ごとにほかの言語を言われたら、そちらを使う。書かなければ ja
# private = ["アクメ", "ロードランナー"]  # desk-kaizen が Issue に入れたら止める語（顧客の日本語の名前、顧客の製品名など）。Customers/ の顧客と資料のフォルダの名前は書かなくても見る

[user]
profile = ""  # 使う人の名前・メール・会社・役割・担当の顧客を書いたファイル（markdown か text）。エージェントが要るときに読む

[google]
# トークンの取り方: 環境変数 GOOGLE_OAUTH_ACCESS_TOKEN、なければ認証情報の JSON
# （GOOGLE_APPLICATION_CREDENTIALS、なければ gcloud の ADC。作るのは desk-doctor が出す gcloud auth application-default login のコマンド）
quota_project = ""  # gcloud の既定の OAuth クライアントで取ったトークンは、これがないと Slides・Docs で 403。自分の OAuth クライアントなら空でよい

# [uc_connections]  # Google の API を、Databricks の Unity Catalog の HTTP の connection を通して呼ぶとき（Google のトークンは connection が持つ）。書かなければ直接呼ぶ
# enabled = true  # false にすると、設定を残したまま直接呼ぶのに戻す
# profile = ""  # ~/.databrickscfg の profile。ワークスペースの URL もここから読み、トークンもこの profile で databricks auth token が取る（DATABRICKS_TOKEN は使わない）。OAuth の profile だけ（PAT なら host と DATABRICKS_TOKEN）
# host = "https://….cloud.databricks.com"  # profile を書かないときのワークスペースの URL（トークンは DATABRICKS_TOKEN、なければこのホストの profile。同じホストの profile が 2 つ以上なら profile を書く）。どちらも書かなければ DATABRICKS_HOST と DATABRICKS_TOKEN（Genie Code など）
# [uc_connections.proxy]  # ホストごとの connection の名前（connection の host はそのホスト、base_path は空）。ないホストは直接呼ぶ
# "www.googleapis.com" = ""     # Drive
# "slides.googleapis.com" = ""  # Slides
# "docs.googleapis.com" = ""    # Docs

[slides]
default_theme = "navy"  # 説明で決まらないときのテーマ。テーマは資料ごとに選ぶ（slides.py themes が名前と説明を出す）。切り替えはスキル slides-build の templates の「Choosing the default theme」

[brand]  # 表紙の社名と著作権表示（ドキュメントのフッターも）、ドキュメントの表紙のロゴ。copyright は要る（desk-doctor が見る）
# company = "アクメ・ジャパン株式会社"  # 表紙の左下。書かなければ置かない
# copyright = "© 2026 Acme, Inc. All rights reserved."  # 全ページの左下。lint が 9pt を通すのは「© <年> <社名> All rights reserved.」の形だけ
# logo = "acme/logo.png"  # ドキュメントの表紙のロゴ。ワークスペースの assets/ の中のパスか URL。書かなければ置かない

[slides.templates]  # テーマの名前 = テンプレートの URL。template.py <名前> --from-base が書き込み、slides.py new が複製する。テーマの値は themes/slides/<名前>.json
# navy = "https://docs.google.com/presentation/d/…/edit"

# [docs]
# default_theme = "acme"  # doc.md に theme: を書かないときのテーマ（themes/docs/acme.json）。書かなければ既定（A4）

# ドキュメントのテーマ（版面・見出しの大きさと色・書体）は、ワークスペースの themes/docs/<名前>.json に書く（スキル docs-build の SKILL.md を開いてから、その themes.md の docs-write-010）。doc.md の頭に theme: <名前>

[docs.templates]  # ドキュメントのテンプレート（Google Docs）。正本は rules/docs-build/templates/<名前>/doc.md。そのフォルダで docs.py new して URL を書く

[review]  # レビューの進め方（deck-workflow の 5 と 9）。既定のままでよい
plan_reviewer = "ai"        # 構成を決めたあと、誰が見るか。"ai"（AI がレビューして、そのまま作る）か "human"（人が確かめてから作る）。資料ごとに言われたら、そちらを使う
deck_review_max_rounds = 3  # /deck-review を回すラウンドの上限（1〜3）。直す指摘が 0 件になったら、そのラウンドで止める。1 なら、直したあとを子に見直させない。ドキュメントも同じ

[feedback.google_comments]  # 資料を返したあと、Google Slides・Docs に付いたコメントを見張る（deck-workflow の comments）。見張りは、資料を作った会話が開いているあいだだけ動く
# ほかの経路の指摘を受けるときは、[feedback.<経路>] を足す
watch_hours = 0  # 最後のコメント（なければ見張り始め）から何時間見張るか。新しいコメントがないまま過ぎたら終える。0 か、書かなければ見張らない（頼まれたときだけ）

[sources]  # 材料を集める道具（deck-workflow の gathering materials）。値は MCP のサーバーかスキルの名前。使わない役割は書かない（資料や URL を貼ってもらう）
# 道具ごとの使い方とその会社の探し場所は recipes/ のレシピ（step: gather）に書く。desk-doctor が、書いた道具が使えるかを見る
# search   = "glean"       # 社内の横断検索
# chat     = "slack"       # 社内のチャット（Microsoft Teams なら、その MCP の名前）
# meetings = ""            # 会議の記録（議事録・文字起こし）
# wiki     = "confluence"  # 社内の wiki（Notion などでもよい）
# crm      = "salesforce"  # 顧客の台帳
# usage    = ""            # 顧客の利用額・利用状況

[drive]
desk = ""       # 個人の資料の根元（例: My Drive の AI Desk Tools）。template.py --from-base は、この下の Themes にテンプレートを作る（なければ作る）。gslides.py keep の差し替え用の複製は直下に、調べものの写し（drive_put.py research）はこの下の Research に作る
shared_themes = ""  # 全社の共有テーマのフォルダ（管理者が template.py で作ったテンプレートの置き場所。見る権限でよい）。slides.py themes が、desk.toml にないテンプレートを候補に出す。
                    # 使うときは slides.py theme <url> で写す（テーマのファイルと [slides.templates] に書く）。管理者は自分の desk の下の Themes を指してよい
customers = ""  # 顧客向けの資料の置き場所の根元（例: 共有ドライブ 10_Customers）
internal = ""   # 顧客に紐づかないスライドの置き場所（例: AI Desk Tools/Slides）
docs = ""       # 顧客に紐づかないドキュメントの置き場所（例: AI Desk Tools/Docs）
